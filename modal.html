<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .janela {
        width: 100vw;
        height: 100vh;
        position: absolute;
        display: none;
        align-items: center;
        justify-content: center;
        top: 0;
        left: 0;
        background: #00000024;
        z-index: 999;


    }


    .janela.abrir {
        display: flex;

    }


    .modal {
        width: 60%;
        min-width: 450px;
        min-height: 200px;
        background-color: rgba(255, 255, 255, 0.507);
        backdrop-filter: blur(10px);
    }

    button {
        width: 100px;
        height: 100px;
        background-color: red;
        color: white;
        font-size: 25px;
        font-weight: bold;
    }

    @keyframes abrirmodal {
        from {
            opacity: 0;
            transform: translate3d(0, -20px, -5px);
        }

        to {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }


    }

    .abrir .modal {
        animation: abrirmodal 0.5s;
    }
</style>

<body>
    <button onclick="abirModal()">Clique aqui</button>

    <div class="janela" id="janela-modal">
        <button onclick="fecharModal()" id="btnFechar">fecha</button>
        <div class="modal">
            <h1>Janela modal</h1>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Commodi perspiciatis illum fuga explicabo
                mollitia quibusdam, iure cumque tempore quidem dolor ex inventore molestias animi, corporis et porro ut
                quam atque.</p>
        </div>
    </div>
</body>

</html>

<script>
    function abirModal() {
        const modal = document.getElementById('janela-modal')
        modal.classList.add('abrir')

        modal.addEventListener('click', (e) => {
            if (e.target.id == 'btnFechar' || e.target.id == 'janela-modal') {
                modal.classList.remove('abrir')
            }
        })
    }
</script>
