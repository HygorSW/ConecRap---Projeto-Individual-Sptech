<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back" />
    <title>Conecrap</title>
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <div class="main"> <!-- div principal  -->
        <img src="./assets/imgsConecRap/login/login.jpg" alt="">

        <div class="main_login">
            <div class="row_voltar"> <!-- icon de voltar -->
                <a href="./index.html" class="voltar_div"><span style="font-size: 50px; color: #000;"
                        class="material-symbols-outlined">arrow_back</span></a>
            </div> <!-- fim icon -->
            <div class="container_login"> <!-- container_login -->
                <div class="titulo_login">
                    <h1>LOGIN</h1>
                </div>
                <div class="campo_input">
                    <div class="label">
                        <p>Email:</p>
                    </div>
                    <input id="email_input" type="email" class="input_login" />
                </div>
                <div class="campo_input">
                    <div class="label">
                        <p>Senha</p>
                    </div>
                    <input id="senha_input" type="password" class="input_login">
                </div>
                <button onclick="entrar()">Entrar</button>
                <p>não possui login?<span> <a href="./cadastro.html"> Cadastra-se</a></span></p>
            </div> <!-- fim container_login -->
            <div id="cardErro" style="display: none; color: red; text-align: center; margin-top: 10px;">
                Email ou senha inválidos!
            </div>

        </div>

    </div> <!-- fim main -->
</body>

</html>

<script>
    function aguardar() {
        // Exemplo de loading simples (pode personalizar com um spinner)
        alert("Aguardando...");
    }
    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            alert("(Mensagem de erro para todos os campos em branco)")
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.idUsuario;

                    setTimeout(function () {
                        alert("Login efetuado com sucesso");
                        window.location.href = "./index.html";
                    }, 1000);
                    // apenas para exibir o loadings

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }
    function finalizarAguardar(mensagem) {
        alert("Finalizou.");
        if (mensagem) {
            alert(mensagem);
        }
    }

    
</script>
