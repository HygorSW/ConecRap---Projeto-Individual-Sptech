<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - ConecRap</title>
    <link rel="stylesheet" href="../css/quiz/questoes.css">
    <link rel="stylesheet" href="../css/quiz/navQuiz.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="main"> <!-- Div principal -->
        <div class="navbar">
            <div class="logo_nav">
                <img src="../assets/imgsConecRap/LogoSemFundo.png" alt="">
            </div>

            <div class="btnDiv">
                <div class="btnNavbar">
                    <img src="../assets/imgsConecRap/quiz/jogos_icon.png" alt="">
                    <h5>Jogos</h5>
                </div>
                <a href="./dashboard.html" class="btnNavbar">
                    <img src="../assets/imgsConecRap/quiz/dash_icon.png" alt="">
                    <h5>Dashboard</h5>
                </a>
            </div>

            <div class="logoutDiv">
                <a href="../index.html" class="btnNavbar">
                    <img src="../assets/imgsConecRap/quiz/logout_icon.png" alt="">
                    <h5>Voltar</h5>
                </a>
            </div>


        </div> <!-- fim Div principal -->
        <div class="container_quiz">

            <div class="progresso" id="progressoBar">
                <div class="barra" id="barrinhaDeProgresso"></div>
                <div class="progressoIndice">
                    <h1 id="indiceBar"></h1>
                </div>
            </div>

            <div class="quiz">
                <div class="jogoContainer" id="idjogoContainer">
                    <div class="title_row" id="infoQuestao">
                        <h1> <span id="spanNumeroDaQuestaoAtual"></span>.<span id="qtdQuestoes"></span> </h1>
                    </div>

                    <div class="btnContainer" id="opcoes">
                        <button class="btnQuiz"
                            onclick=" alternativaResp = 'A';  alternativaSelecionada = 'primeiraOpcao' , responder()"
                            id="primeiraOpcao">

                        </button>
                        <button class="btnQuiz"
                            onclick=" alternativaResp = 'B';  alternativaSelecionada = 'segundaOpcao' , responder()"
                            id="segundaOpcao">

                        </button>
                        <button class="btnQuiz"
                            onclick=" alternativaResp = 'C' ;  alternativaSelecionada = 'terceiraOpcao' , responder()"
                            id="terceiraOpcao">

                        </button>
                        <button class="btnQuiz"
                            onclick=" alternativaResp = 'D';  alternativaSelecionada = 'quartaOpcao' , responder()"
                            id="quartaOpcao">

                        </button>
                    </div>

                </div>
                <button onclick="progresso = 0, inicioQuiz(),   apresentarQuestoes()" id="btnIniciarQuiz"
                    class="btnStart">
                    INICIAR</button>

                <div class="derrotaDiv" id="youloose">
                    <div class="DerrotaLeft">
                        <h1>VOCÊ PERDEU</h1>
                        <button onclick="tentarNovamente()" class="btnStart" id="btnDerrota">RECOMEÇAR</button>
                        <div id="resultadoLoose"></div>

                    </div>
                    <div class="DerrotaRight">
                        <img src="../assets/imgsConecRap/quiz/eu_perdeu.png" alt="">
                    </div>
                </div>


                <div class="resultadoDiv" id="miniDash">
                    <div class="rowTitle">
                        <h1>PARABÉNS!</h1>
                    </div>
                    <div class="containerResultado">
                        <h1 id="resultadoText"></h1>
                    </div>
                    <div class="rowBtnResultado">
                        <button onclick="tentarNovamente()" class="btnResultado">RECOMEÇAR</button>
                    </div>
                </div>



            </div>
        </div>
    </div>
    </div>
</body>

</html>

<script>
    let listaDeQuestoes = [];

    // variáveis globais    
    let numeroDaQuestaoAtual = 0
    let pontuacaoFinal = 0
    let tentativaIncorreta = 0
    let certas = 0
    let erradas = 0
    let quantidadeDeQuestoes = listaDeQuestoes.length
    var TentativaFk = 0;
    // quiz global
    var alternativaResp;
    var alternativaSelecionada;
    var progresso = 0;
    var barraWidth = 0;
    var acertos = 0;
    var erros = 0;
    var totalAcertos = 0;






    // Função para carregar as questões
    function carregarQuestoes() {
        fetch("/quiz/questoes")
            .then(response => response.json())
            .then(data => {
                listaDeQuestoes = data; // Popula a listaDeQuestoes com as questões do banco

                if (progresso == listaDeQuestoes[listaDeQuestoes.length + 1]) {
                    progresso = progresso = 0;
                } else {
                    preencherHTMLcomQuestaoAtual(progresso); // Exibe a primeira questão
                }
            })
            .catch(error => {
                console.error("Erro ao carregar as questões:", error);
            });
    }

    // Função para preencher as questões na página
    function preencherHTMLcomQuestaoAtual(index) {

        const questaoAtual = listaDeQuestoes[index]; // puxa a questão atual com base no parametro

        console.log(questaoAtual); // Verifique se as questões estão sendo carregadas corretamente
        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = questaoAtual.idQuestoes;
        document.getElementById("qtdQuestoes").innerHTML = questaoAtual.pergunta_texto;
        document.getElementById("primeiraOpcao").innerHTML = questaoAtual.alternativaA;
        document.getElementById("segundaOpcao").innerHTML = questaoAtual.alternativaB;
        document.getElementById("terceiraOpcao").innerHTML = questaoAtual.alternativaC;
        document.getElementById("quartaOpcao").innerHTML = questaoAtual.alternativaD;
        if (index == listaDeQuestoes.length - 1) {
            alert('Ultima questão!')
        }

    }



    document.getElementById('btnIniciarQuiz').addEventListener('click', carregarQuestoes);


    // apresentar as questões ( deixa a div visivel )
    function apresentarQuestoes() {
        idjogoContainer.style.opacity = 1;
        btnIniciarQuiz.style.opacity = 0;
        barrinhaDeProgresso.style.width = 10;
        progressoBar.style.display = 'flex';
        indiceBar.innerHTML = `${progresso}/${listaDeQuestoes.length}`;
    }


    // funcao de resposta
    function responder() {
        if (progresso < listaDeQuestoes.length) {

            // puxa a questão atual
            const questaoAtual = listaDeQuestoes[progresso];


            // valda a resposta do usuario
            if (alternativaResp == questaoAtual.alternativa_correta) {
                document.getElementById(alternativaSelecionada).style.background = 'green';

                setTimeout(() => {
                    progresso = progresso + 1;

                    if (progresso < listaDeQuestoes.length) {
                        preencherHTMLcomQuestaoAtual(progresso);
                        primeiraOpcao.style.background = 'white';
                        segundaOpcao.style.background = 'white';
                        terceiraOpcao.style.background = 'white';
                        quartaOpcao.style.background = 'white';

                        barraWidth = (progresso * 100) / listaDeQuestoes.length;
                        barrinhaDeProgresso.style.width = `${barraWidth}%`;
                        indiceBar.innerHTML = `${progresso}/${listaDeQuestoes.length}`;
                        acertos = acertos + 1;
                    } else {
                        // chegou ao fim com sucesso
                        miniDash.classList.add('ativo');
                        opcoes.style.display = 'none';
                        progressoBar.style.display = 'none';
                        acertos = acertos + 1;
                        resultadoText.innerHTML = `você acertou: ${acertos}/${listaDeQuestoes.length}`;
                        cadastrarTentativa();
                    }
                }, 100);

            } else {
                //caso for errada
                document.getElementById(alternativaSelecionada).style.background = 'red';
                setTimeout(() => {
                    youloose.classList.add('ativo');
                    resultadoLoose.innerHTML = `você acertou: ${acertos}/${listaDeQuestoes.length}`;

                    progressoBar.style.display = 'none';
                    erros = erros + 1;
                    cadastrarTentativa();
                }, 100);
            }

        }
    }

    function tentarNovamente() {
        // atualiza a página
        window.location.reload()
    }




    function cadastrarTentativa() {
        buscarFK();
        if (tentativaFk === null) {
            window.alert("Erro ao carregar a tentativa FK. Tente novamente.");
            return false; // Interrompe a execução se tentativaFk não foi carregada
        }

        var idUsuario = sessionStorage.ID_USUARIO;
        totalAcertos = acertos;
        var totalErros = listaDeQuestoes.length - totalAcertos;

        // fetch para inserir o resultado no banco
        fetch(`/quiz/tentativa/${idUsuario}`, {
            method: "post",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                acertosServer: totalAcertos,
                errosServer: totalErros,
                tentativaServer: tentativaFk,

            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    window.alert("tentativa realizada com sucesso pelo usuario de ID: " + idUsuario + "!");
                    // window.location = "./questoes.html";
                } else if (resposta.status == 404) {
                    window.alert("Deu 404!");
                } else {
                    throw ("Houve um erro ao tentar realizar o quiz! Código da resposta: " + resposta.status);
                }
            }).catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;

    }


    // primeira função de todas
    function inicioQuiz() {
        var idUsuario = sessionStorage.ID_USUARIO;
        // cadsatra uma tentativa no banco
        fetch(`/quiz/inicio/${idUsuario}`, {
            method: "post",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    window.alert("tentativa realizada com sucesso pelo usuario de ID: " + idUsuario + "!");
                    // window.location = "./questoes.html";
                } else if (resposta.status == 404) {
                    window.alert("Deu 404!");
                } else {
                    throw ("Houve um erro ao tentar realizar o quiz! Código da resposta: " + resposta.status);
                }
            }).catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });


        return false;
    }

    // pegar a ultima tentativa registrada
    function buscarFK(retorno) {
        var idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/quiz/fk/${idUsuario}`)
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    tentativaFk = data[0].idTentativa; // Pega o valor da tentativa
                    console.log("TentativaFk carregada:", tentativaFk);
                    if (retorno) retorno(tentativaFk); // Chama o retorno com o valor
                } else {
                    console.error("Nenhuma tentativa encontrada.");
                    if (retorno) retorno(null); // Chama o retorno com null
                }
            })
            .catch(error => {
                console.error("Erro ao carregar a FK:", error);
                if (retorno) retorno(null); // Chama o retorno com null
            });
    }

    // valida se achou
    buscarFK(function (tentativaFk) {
        if (tentativaFk) {
            console.log("Valor recebido no retorno:", tentativaFk);
        } else {
            console.log("Tentativa não encontrada ou erro.");
        }
    });




</script>
