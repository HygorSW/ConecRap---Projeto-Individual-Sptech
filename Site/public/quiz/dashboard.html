<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - ConecRap</title>
    <link rel="stylesheet" href="../css/quiz/dashboard.css">
    <link rel="stylesheet" href="../css/quiz/navQuiz.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body onload="carregarMétricas()">
    <div class="main"> <!-- Div principal -->
        <div class="navbar">
            <div class="logo_nav">
                <img src="../assets/imgsConecRap/LogoSemFundo.png" alt="">
            </div>

            <div class="btnDiv">
                <a href="./quiz.html" class="btnNavbar">
                    <img src="../assets/imgsConecRap/quiz/jogos_icon.png" alt="">
                    <h5>Jogos</h5>
                </a>
                <div class="btnNavbar">
                    <img src="../assets/imgsConecRap/quiz/dash_icon.png" alt="">
                    <h5>Dashboard</h5>
                </div>
            </div>

            <div class="logoutDiv">
                <a href="../index.html" class="btnNavbar">
                    <img src="../assets/imgsConecRap/quiz/logout_icon.png" alt="">
                    <h5>Logout</h5>
                </a>
            </div>


        </div> <!-- fim Div principal -->
        <div class="container_dashboard">
            <h1>Estatísticas Gerais</h1>
            <div class="dashboard">
                <div class="container_graficos">
                    <div class="grafico_Dash">
                        <canvas id="graficoCategoria"></canvas>
                    </div>

                    <div class="grafico_Dash">
                        <canvas id="graficoBarra"></canvas>
                    </div>
                </div>
                <div class="container_indicadores">
                    <div class="indicador">
                        <div class="title_indicador">
                            <h5>Média de acertos por quiz:</h5>
                            <img style="height: 50px; width: 50px;"
                                src="../assets/imgsConecRap/home/icons/icon_microfone.png" alt="">
                        </div>
                        <div id="value_kpi">
                        </div>
                        <div id="desc_kpi">
                        </div>

                    </div>
                    <div class="indicador">
                        <div class="title_indicador">
                            <h5>Total de vezes que você obteve 100%</h5>
                            <img style="height: 50px; width: 50px;"
                                src="../assets/imgsConecRap/home/icons/icon_microfone.png" alt="">
                        </div>
                        <div id="value_kpi_2">
                        </div>
                        <div id="desc_kpi_2">
                        </div>
                    </div>
                </div>
                <div class="container_historico">
                    <table>
                        <thead>
                            <tr>
                                <th>tentativa</th>
                                <th>Pontuação</th>
                                <th>Data</th>
                                <th>Tempo</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaTentativas">

                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</body>

</html>

<script>
    var listaTentativas = [];
    var errosGraficos = 0;
    var acertosGraficos = 0

    // Função para carregar as métricas
    function carregarMétricas() {
        var idUsuario = sessionStorage.ID_USUARIO;
        fetch("/quiz/dashboard")
            .then(response => response.json())
            .then(data => {
                listaTentativas = data; // Popula as metricas
                preencherTabela();

            })
            .catch(error => {
                console.error("Erro ao carregar as tentativas:", error);
            });
    }

    // Função para lista de tentativas na página
    function preencherTabela() {
        document.getElementById("tabelaTentativas").innerHTML = ""; // limpa antes
        var totalDeacertos = 0;
        var totalPlatinou = 0;
        acertosGraficos = listaTentativas[listaTentativas.length - 1].acertos;
        errosGraficos = listaTentativas[listaTentativas.length - 1].qtd_questoes - listaTentativas[listaTentativas.length - 1].acertos;


        for (var contador = listaTentativas.length - 1; contador >= 0; contador--) {

            var tentativa_atual = listaTentativas[contador];
            console.log(tentativa_atual); // Verifique se as questões estão sendo carregadas corretamente
            // Aqui você pode criar dinamicamente uma linha na tabela
            var novaLinha = `
            <tr>
                <td>${tentativa_atual.idResultado}</td>
                <td>${tentativa_atual.acertos}/${tentativa_atual.qtd_questoes}</td>
                <td>${(new Date(tentativa_atual.fim)).toISOString().split('T')[0].split('-').reverse().join('/')}</td>
                <td>${tentativa_atual.tempo}</td>
            </tr>
        `;
            document.getElementById("tabelaTentativas").innerHTML += novaLinha;
            // graficos
            totalDeacertos = totalDeacertos + tentativa_atual.acertos;

            if (tentativa_atual.acertos == tentativa_atual.qtd_questoes) {
                totalPlatinou++;
            }
        }

        // grafico pizza
        var graficoCategoria = new Chart(document.getElementById('graficoCategoria').getContext('2d'), {
            type: 'pie',
            data: {
                labels: ['Acertos', 'Erros'],
                datasets: [{
                    label: 'questões',
                    data: [acertosGraficos, errosGraficos],
                    backgroundColor: [
                        'orange', '#111827',
                    ],
                    borderColor: '#fff',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom'
                    },
                    title: {
                        display: true,
                        text: 'Distribuição de acertos (última tentativa)'
                    }
                }
            }
        });





        // grafico barra
        var graficoBarra = new Chart(document.getElementById('graficoBarra').getContext('2d'), {
            type: 'bar',
            data: {
                labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00', '22:00'],
                datasets: [{
                    label: 'Quiz Tentativas',
                    data: [2, 3, 2, 4, 10, 11, 5, 4, 2.3, 2, 2.5],
                    borderWidth: 2,
                    borderColor: 'orange',
                    backgroundColor: 'rgba(255, 165, 0, 0.2)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        var mediaAcertos = totalDeacertos / listaTentativas.length;
        document.getElementById("value_kpi").innerHTML = `${mediaAcertos.toFixed(1)}/${listaTentativas[listaTentativas.length - 1].qtd_questoes}`;
        var porcentagem = (mediaAcertos / listaTentativas[listaTentativas.length - 1].qtd_questoes) * 100;
        document.getElementById("desc_kpi").innerHTML = `<p>${porcentagem.toFixed(0)}% de acertos</p>`;
        document.getElementById("value_kpi_2").innerHTML = `${totalPlatinou}`
    }






</script>
