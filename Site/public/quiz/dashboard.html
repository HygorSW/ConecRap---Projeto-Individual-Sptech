<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - ConecRap</title>
    <link rel="stylesheet" href="../css/quiz/dashboard.css">
    <link rel="stylesheet" href="../css/quiz/navQuiz.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>
    <div class="main"> <!-- Div principal -->
        <div class="navbar">
            <div class="logo_nav">
                <img src="../assets/imgsConecRap/LogoSemFundo.png" alt="">
            </div>

            <div class="btnDiv">
                <a href="./quiz.html" class="btnNavbar">
                    <img src="../assets/imgsConecRap/quiz/jogos_icon.png" alt="">
                    <h5>Jogos</h5>
                </a>
                <div class="btnNavbar">
                    <img src="../assets/imgsConecRap/quiz/dash_icon.png" alt="">
                    <h5>Dashboard</h5>
                </div>
            </div>

            <div class="logoutDiv">
                <a href="../index.html" class="btnNavbar">
                    <img src="../assets/imgsConecRap/quiz/logout_icon.png" alt="">
                    <h5>Logout</h5>
                </a>
            </div>


        </div> <!-- fim Div principal -->
        <div class="container_dashboard">
            <h1>Estatísticas Gerais</h1>
            <div class="dashboard">
                <div class="container_graficos">
                    <div class="grafico_Dash">
                        <canvas id="graficoCategoria"></canvas>
                    </div>

                    <div class="grafico_Dash">
                        <canvas id="graficoBarra"></canvas>
                    </div>
                </div>
                <div class="container_indicadores">
                    <div class="indicador">
                        <div class="title_indicador">
                            <h5>Média de acertos por quiz:</h5>
                            <img style="height: 50px; width: 50px;"
                                src="../assets/imgsConecRap/home/icons/icon_microfone.png" alt="">
                        </div>
                        <div class="value_kpi">
                            0/10
                        </div>
                        <div class="desc_kpi">
                            <p>0% de acertos</p>
                        </div>

                    </div>
                    <div class="indicador">
                        <div class="title_indicador">
                            <h5>Total de vezes que você obteve 100%</h5>
                            <img style="height: 50px; width: 50px;"
                                src="../assets/imgsConecRap/home/icons/icon_microfone.png" alt="">
                        </div>
                        <div class="value_kpi">
                            0/10
                        </div>
                        <div class="desc_kpi">
                            <p>0% de acertos</p>
                        </div>
                    </div>
                </div>
                <div class="container_historico">
                    <table>
                        <thead>
                            <tr>
                                <th>tentativa</th>
                                <th>Pontuação</th>
                                <th>Data</th>
                                <th>Tempo</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>3/10</td>
                                <td>10/04/2025</td>
                                <td>2m 45s</td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>3/10</td>
                                <td>10/04/2025</td>
                                <td>2m 45s</td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>3/10</td>
                                <td>10/04/2025</td>
                                <td>2m 45s</td>
                            </tr>
                            <tr>
                                <td>4</td>
                                <td>3/10</td>
                                <td>10/04/2025</td>
                                <td>2m 45s</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</body>

</html>

<script>

    // grafico barra
    var graficoBarra = new Chart(document.getElementById('graficoBarra').getContext('2d'), {
        type: 'bar',
        data: {
            labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00', '22:00'],
            datasets: [{
                label: 'Nível de Gás Natural',
                data: [2, 3, 2, 4, 10, 11, 5, 4, 2.3, 2, 2.5],
                borderWidth: 2,
                borderColor: 'orange',
                backgroundColor: 'rgba(255, 165, 0, 0.2)',
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });


    // grafico pizza
    var graficoCategoria = new Chart(document.getElementById('graficoCategoria').getContext('2d'), {
        type: 'pie',
        data: {
            labels: ['Erros', 'Acertos'],
            datasets: [{
                label: 'questões',
                data: [2, 8],
                backgroundColor: [
                    'orange', '#111827',
                ],
                borderColor: '#fff',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                },
                title: {
                    display: true,
                    text: 'Distribuição de acertos'
                }
            }
        }
    });
</script>
