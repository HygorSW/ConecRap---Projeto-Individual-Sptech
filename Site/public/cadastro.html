<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back" />
  <title>Conecrap</title>
  <link rel="stylesheet" href="./css/login.css">
</head>

<body>
  <div class="main"> <!-- div principal  -->

    <div class="main_login">
      <div class="row_voltar"> <!-- icon de voltar -->
        <a href="./index.html" class="voltar_div"><span style="font-size: 50px; color: #000;"
            class="material-symbols-outlined">arrow_back</span></a>
      </div> <!-- fim icon -->
      <div class="container_login"> <!-- container_login -->
        <div class="titulo_login">
          <h1>CRIE UMA CONTA</h1>
        </div>
        <div class="campo_input">
          <div class="label">
            <p>Nome:</p>
          </div>
          <input id="nome_input" type="text" class="input_login" />
        </div>

        <div class="campo_input">
          <div class="label">
            <p>Email</p>
          </div>
          <input id="email_input" type="email" class="input_login" />
        </div>

        <div class="campo_input">
          <div class="label">
            <p>Senha</p>
          </div>
          <input id="senha_input" type="password" class="input_login" />
        </div>

        <div class="campo_input">
          <div class="label">
            <p>Confirmar senha</p>
          </div>
          <input id="confirmar_senha_input" type="password" class="input_login" />
        </div>

        <button onclick="cadastrar()">CADASTRAR</button>
        <p>Já possui login? <a href="./login.html">Faça login</a></p>

      </div> <!-- fim container_login -->
      <div id="cardErro" style="display: none; color: red; text-align: center; margin-top: 10px;">
        <span id="mensagem_erro">Erro ao cadastrar.</span>
      </div>

    </div>
    <img src="./assets/imgsConecRap/login/login.jpg" alt="">

  </div> <!-- fim main -->
</body>

</html>
<script>
function cadastrar() {
  var nomeVar = nome_input.value;
  var emailVar = email_input.value;
  var senhaVar = senha_input.value;
  var confirmacaoSenhaVar = confirmar_senha_input.value;

  if (
    nomeVar == "" ||
    emailVar == "" ||
    senhaVar == "" ||
    confirmacaoSenhaVar == ""
  ) {
    cardErro.style.display = "block";
    mensagem_erro.innerHTML = "Preencha todos os campos.";
    return false;
  }

  if (senhaVar != confirmacaoSenhaVar) {
    cardErro.style.display = "block";
    mensagem_erro.innerHTML = "As senhas não coincidem!";
    return false;
  }

  fetch("/usuarios/cadastrar", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      nomeServer: nomeVar,
      emailServer: emailVar,
      senhaServer: senhaVar,
    }),
  })
    .then(function (resposta) {
      if (resposta.ok) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Cadastro efetuado com sucesso!";

        setTimeout(function () {
          window.location.href = "./login.html";
        }, 2000);
      } else {
        throw "Houve um erro ao tentar realizar o cadastro!";
      }
    })
    .catch(function (resposta) {
      console.log(`#ERRO: ${resposta}`);
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Erro ao realizar cadastro.";
    });

  return false;
}


  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
